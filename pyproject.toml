[project]
name = "reverseopenshell-mvp"
version = "0.1.0"
description = "Minimal inbound AI request control layer backed by OpenShell sandboxes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openshell>=0.1.0",
    "PyYAML>=6.0.2,<7",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
