version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /usr/local
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /dev/null
    - /app
  read_write:
    - /tmp
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies: {}
